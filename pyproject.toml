[project]
name = "sec-etl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # 0.7.8 has no linux wheel above cp310, so on Connect's Python (3.11/3.12)
    # pip built it from source and the restore was OOM-killed (exit 137).
    # 0.7.11 ships cp312 wheels and still satisfies thinc's blis>=0.7.8,<0.8.0.
    "blis==0.7.11",
    "numpy<2",
    "pandas>=2,<3",
    "psycopg2-binary>=2.9.11",
    "requests>=2.32.5",
    "spacy==3.7.5",
    "sqlalchemy>=2.0.44",
    "wget>=3.2",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pip>=25.2",
    "posit-sdk>=0.12.0",
]
